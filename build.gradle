plugins {
    id "java"
    id "application"
}

group = "hits"
version = "2.0"

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = "hits.ui.HitsApp"
    // AudioSynthesizer.openStream is the JDK software synth. The package is not exported.
    applicationDefaultJvmArgs = ["--add-exports", "java.desktop/com.sun.media.sound=ALL-UNNAMED"]
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    // Gradle 9 stops adding this automatically when useJUnitPlatform() is set.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.named("test") {
    useJUnitPlatform()
    jvmArgs("--add-exports", "java.desktop/com.sun.media.sound=ALL-UNNAMED")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
