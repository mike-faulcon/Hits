name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and build
        run: ./gradlew test build --no-daemon

      - name: CLI render smoke
        run: |
          set -euo pipefail
          ./gradlew installDist --no-daemon
          script="build/install/hits/bin/hits"
          test -x "$script"
          grep -q 'com.sun.media.sound=ALL-UNNAMED' "$script"
          fixture="src/test/resources/fixtures/sparse-808-groove.json"
          wav="${RUNNER_TEMP}/sparse-808-groove.wav"
          mid="${RUNNER_TEMP}/sparse-808-groove.mid"
          "$script" render "$fixture" --out "$wav"
          "$script" render "$fixture" --song --out "$mid"
          if [ ! -s "$wav" ] || [ ! -s "$mid" ]; then
            echo "CLI render produced a missing or empty file"
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 3
          if-no-files-found: ignore
