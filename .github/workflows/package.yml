name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux deb
            type: deb
          - os: macos-latest
            label: macOS dmg
            type: dmg
          - os: windows-latest
            label: Windows msi
            type: msi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Debian packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = Join-Path $env:RUNNER_TEMP "wix.zip"
          $dest = Join-Path $env:RUNNER_TEMP "wix"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $candle = Get-ChildItem -Path $dest -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle) {
            throw "candle.exe was not in the WiX zip"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $candle.DirectoryName
          $env:PATH = "$($candle.DirectoryName);$env:PATH"
          Get-Command candle, light | Format-Table Name, Source

      - name: Package
        shell: bash
        run: ./gradlew packageApp --no-daemon -PpackageType=${{ matrix.type }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: hits-${{ runner.os }}
          path: build/jpackage/dist/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: hits-*
          path: packages
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find packages -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No packages to publish"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          {
            echo "Unsigned Hits builds for this tag. Each one includes a Java runtime."
            echo
            echo "- macOS: open the .dmg, drag Hits to Applications, then right-click Hits and choose Open the first time."
            echo "- Windows: if SmartScreen appears, choose More info, then Run anyway."
            echo "- Linux: install the .deb and launch Hits. Sample beats are copied to ~/Hits/beats when that folder is empty."
            echo
            echo "These builds are not code-signed or notarized."
          } > release-notes.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.txt
          fi
